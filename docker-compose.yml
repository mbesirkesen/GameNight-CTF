services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      # Aynı origin (nginx) — CORS gerekmez ama güvenli tut
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ctf_data:/app/data
      - ctf_uploads:/app/uploads
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Boş = tarayıcı aynı host'a (/api, /ws) gider
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ctf_data:
  ctf_uploads:
