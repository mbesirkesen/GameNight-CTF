<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Energy drink takeover">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#fb7185" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="12%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="78%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="canShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#sky)"/>
  <rect width="900" height="1200" fill="url(#spot)"/>

  <!-- matrix rain hints -->
  <g fill="#22d3ee" opacity="0.18" font-family="ui-monospace, monospace" font-size="18">
    <text x="60" y="80">01</text><text x="60" y="110">CTF</text><text x="60" y="140">7F</text><text x="60" y="170">A9</text>
    <text x="820" y="200">RED</text><text x="820" y="230">BULL</text><text x="820" y="260">0x</text>
    <text x="120" y="980">HACK</text><text x="780" y="1040">LIVE</text>
  </g>

  <!-- wings (abstract sponsor energy) -->
  <g opacity="0.55" filter="url(#softGlow)">
    <path d="M250 420 C120 360 80 250 110 180 C180 260 220 330 250 420 Z" fill="#ef4444"/>
    <path d="M250 420 C160 390 90 330 70 250 C150 300 210 360 250 420 Z" fill="#22d3ee" opacity="0.7"/>
    <path d="M650 420 C780 360 820 250 790 180 C720 260 680 330 650 420 Z" fill="#ef4444"/>
    <path d="M650 420 C740 390 810 330 830 250 C750 300 690 360 650 420 Z" fill="#22d3ee" opacity="0.7"/>
  </g>

  <!-- person -->
  <g transform="translate(450 470)">
    <!-- hoodie torso -->
    <path d="M-120 40 C-100 -10 -40 -40 0 -44 C40 -40 100 -10 120 40 C130 120 125 230 110 310 L-110 310 C-125 230 -130 120 -120 40 Z" fill="url(#hoodie)"/>
    <path d="M-35 -20 L0 -55 L35 -20 L20 40 L-20 40 Z" fill="#334155"/>
    <!-- head -->
    <ellipse cx="0" cy="-110" rx="68" ry="78" fill="url(#skin)"/>
    <!-- hair -->
    <path d="M-70 -130 C-60 -190 60 -195 70 -130 C40 -160 -40 -160 -70 -130 Z" fill="#0f172a"/>
    <!-- eyes closed chill -->
    <path d="M-28 -115 Q-18 -108 -8 -115" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M8 -115 Q18 -108 28 -115" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- slight smile -->
    <path d="M-12 -85 Q0 -75 12 -85" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- arm holding can to mouth -->
    <g transform="rotate(-18 70 -40)">
      <path d="M40 -20 C70 -10 95 20 105 70 C110 95 95 115 70 110 C55 108 45 90 42 70 Z" fill="url(#skin)"/>
      <!-- can -->
      <g transform="translate(78 -55)">
        <rect x="-28" y="0" width="56" height="130" rx="10" fill="url(#canBody)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="-28" y="0" width="56" height="130" rx="10" fill="url(#canShine)"/>
        <rect x="-18" y="-10" width="36" height="14" rx="4" fill="#e2e8f0"/>
        <text x="0" y="58" text-anchor="middle" fill="#fff" font-family="Arial Black, Impact, sans-serif" font-size="14" letter-spacing="2">ENERGY</text>
        <text x="0" y="78" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="10">GIVES YOU WINGS</text>
      </g>
    </g>
  </g>

  <!-- floor glow -->
  <ellipse cx="450" cy="980" rx="220" ry="28" fill="#ef4444" opacity="0.25"/>
  <ellipse cx="450" cy="980" rx="140" ry="16" fill="#22d3ee" opacity="0.2"/>

  <!-- corner HUD -->
  <g fill="none" stroke="#fb7185" stroke-width="2" opacity="0.7">
    <path d="M40 40 H120 V50"/>
    <path d="M860 40 H780 V50"/>
    <path d="M40 1160 H120 V1150"/>
    <path d="M860 1160 H780 V1150"/>
  </g>
</svg>
